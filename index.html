<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅遊記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.6 "Huninn","Iansui","Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 100px;min-height:100vh;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
header h1{font-size:21px;margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.br{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--pri) 62%,transparent) 58% 92%,transparent 92%);padding:0 8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px;max-width:560px;margin:0 auto}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--pri);color:var(--on);cursor:pointer;box-shadow:var(--sh)}
button.g{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:none;padding:8px 14px}
button.d{background:var(--card);color:var(--neg);border:2px solid var(--bd);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 70%,#000);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.trip{display:block;width:100%;text-align:left;color:var(--tx);font-weight:400}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0}
.row input[type=number]{width:120px}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:18px;background:var(--inp);color:var(--tx);margin:4px 0}
input[type=checkbox]{width:auto;margin:0 6px 0 0;accent-color:var(--pri)}
label{display:block;font-size:14px;color:var(--sub);margin-top:10px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:4px 2px 10px}
.chips button{white-space:nowrap;padding:6px 14px}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--warnb);color:var(--warn)}
.badge.p{background:var(--perb);color:var(--per)}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));padding:14px 22px;font-size:17px;box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 60%,transparent)}
#sheet{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
#sheet h3{margin:0 0 6px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tbg);color:var(--tfg);padding:10px 18px;border-radius:99px;z-index:30;display:none;max-width:90%}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swb{background:var(--c);color:var(--on);padding:8px 14px}
#kid{position:fixed;left:50%;top:50%;width:min(80vw,380px);aspect-ratio:240/300;transform:translate(-50%,-50%);opacity:.8;pointer-events:none;z-index:0}
#kid svg{width:100%;height:100%}
header,main{position:relative;z-index:1}
.kh{fill:color-mix(in srgb,var(--tx) 50%,#fff)}.ka{fill:var(--pri)}.ks{fill:var(--sec)}.kk{fill:#ffe9dc}.kc{fill:#F2A7B8}.ke{fill:var(--tx)}
.kq{fill:color-mix(in srgb,var(--pri) 45%,#fff)}.kl{stroke:#ffe3d3}.kt{stroke:color-mix(in srgb,var(--tx) 50%,#fff)}.kw{fill:#fff}

.kb{fill:color-mix(in srgb,#f3d58d 65%,var(--sec))}.kg{fill:#4a3b36;stroke:#f1c15a;stroke-width:2}
label.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:16px}
.chk input{width:22px;height:22px;margin:0}
.row.done{opacity:.55}.row.done .amt,.row.done .chk span{text-decoration:line-through}

D%27.38%27%2F%3E%3Cpath%20d%3D%27M50%20158L86%20112M84%20158L120%20112M118%20158L154%20112M152%20158L188%20112M186%20158L222%20112M220%20158L256%20112M254%20158L290%20112M288%20158L324%20112M322%20158L358%20112M356%20158L392%20112M390%20158L426%20112M424%20158L460%20112M458%20158L494%20112M492%20158L528%20112%27%20stroke%3D%27%23b08a5a%27%20stroke-opacity%3D%27.25%27%20stroke-width%3D%271.4%27%20stroke-linecap%3D%27round%27%20fill%3D%27none%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}

F%3E%3Cpath%20d%3D%27M50%20158L86%20112M84%20158L120%20112M118%20158L154%20112M152%20158L188%20112M186%20158L222%20112M220%20158L256%20112M254%20158L290%20112M288%20158L324%20112M322%20158L358%20112M356%20158L392%20112M390%20158L426%20112M424%20158L460%20112M458%20158L494%20112M492%20158L528%20112%27%20stroke%3D%27%238f7e6b%27%20stroke-opacity%3D%27.25%27%20stroke-width%3D%271.4%27%20stroke-linecap%3D%27round%27%20fill%3D%27none%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}

<body>
<div id="bg" aria-hidden="true"></div>
<div id="art" aria-hidden="true"></div>
<div id="app"></div>
<div id="sheet"><div id="sbody"></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,query,orderBy,serverTimestamp,arrayUnion} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDuy_r37AhVRdNtbwjtIIROgaukOgpW5-Y",
  authDomain:"travelledger-8ecf8.firebaseapp.com",
  projectId:"travelledger-8ecf8",
  storageBucket:"travelledger-8ecf8.firebasestorage.app",
  messagingSenderId:"365200427932",
  appId:"1:365200427932:web:74d5e8bf6e2fb122da1659"
});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round(x*100)/100;
const r4=x=>Math.round(x*10000)/10000;
const CURS=['TWD','JPY','USD','KRW','EUR','HKD','THB','SGD','CNY','GBP'];
const CN={JPY:'日幣',USD:'美元',KRW:'韓元',EUR:'歐元',HKD:'港幣',THB:'泰銖',SGD:'新加坡幣',CNY:'人民幣',GBP:'英鎊'};
const SYM={TWD:'NT$',JPY:'¥',USD:'US$',KRW:'₩',EUR:'€',HKD:'HK$',THB:'฿',SGD:'S$',CNY:'CN¥',GBP:'£'};
const DEF={TWD:1,JPY:0.21,USD:31,KRW:0.023,EUR:35,HKD:4,THB:0.9,SGD:24,CNY:4.3,GBP:41};
const sym=c=>SYM[c]||(c?c+' ':'');
const num=x=>r2(x).toLocaleString('zh-TW',{maximumFractionDigits:2});
const money=(x,c)=>sym(c||'TWD')+num(x);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

let S={user:null,local:JSON.parse(ls('tl_trips')||'[]'),cloud:[],tid:null,trip:null,exps:[],tab:'exp',flt:'all',me:null,ef:{},u1:null,u2:null,u3:null};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function sheet(h){$('#sbody').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}

/* ---------- trips list ---------- */
function addTrip(id,name){
  if(!S.local.find(t=>t.id==id)){S.local.push({id,name});ls('tl_trips',JSON.stringify(S.local))}
  if(S.user&&!S.cloud.find(t=>t.id==id))setDoc(doc(db,'users',S.user.uid),{trips:arrayUnion({id,name})},{merge:true}).catch(()=>{});
}
const allTrips=()=>{const m=new Map();[...S.local,...S.cloud].forEach(t=>m.set(t.id,t));return [...m.values()].reverse()};

onAuthStateChanged(auth,u=>{
  S.user=u;if(S.u1){S.u1();S.u1=null}
  if(u){
    S.u1=onSnapshot(doc(db,'users',u.uid),d=>{S.cloud=d.data()?.trips||[];render()});
    if(S.local.length)setDoc(doc(db,'users',u.uid),{trips:arrayUnion(...S.local)},{merge:true}).catch(()=>{});
  }else S.cloud=[];
  render();
});

/* ---------- open / leave trip ---------- */
function openTrip(id,push=true){
  S.u2&&S.u2();S.u3&&S.u3();S.u4&&S.u4();
  Object.assign(S,{tid:id,trip:null,exps:[],stops:[],map:null,tab:'plan',flt:'all',me:ls('tl_me_'+id)});
  if(push)history.pushState({},'','?t='+id);
  S.u2=onSnapshot(doc(db,'trips',id),d=>{
    if(!d.exists())S.trip=false;
    else{S.trip={id,...d.data()};addTrip(id,S.trip.name)}
    render();
  },()=>{S.trip=false;render()});
  S.u4=onSnapshot(query(collection(db,'trips',id,'stops'),orderBy('ts','asc')),s=>{S.stops=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  S.u3=onSnapshot(query(collection(db,'trips',id,'expenses'),orderBy('ts','desc')),s=>{
    S.exps=s.docs.map(d=>({id:d.id,...d.data()}));render();
  });
  render();
}
function goHome(push=true){
  S.u2&&S.u2();S.u3&&S.u3();S.u4&&S.u4();S.tid=null;S.trip=null;
  if(push)history.pushState({},'','./');
  render();
}
window.addEventListener('popstate',()=>{const t=new URLSearchParams(location.search).get('t');t?openTrip(t,false):goHome(false)});

/* ---------- calculations ---------- */
const M=()=>S.trip.members;
const nm=id=>M().find(m=>m.id==id)?.name||'?';
const BASE='TWD';
const rate=c=>{c=c||S.trip.cur;if(c==BASE)return 1;const r=S.trip.rates?.[c];return r>0?r:(DEF[c]||1)};
function owed(e){
  const s=e.split;if(!s||s.t=='personal')return {};
  const ids=Object.keys(s.w),o={};
  if(s.t=='amount')ids.forEach(i=>o[i]=s.w[i]);
  else{const tot=ids.reduce((a,i)=>a+s.w[i],0);ids.forEach(i=>o[i]=e.amount*s.w[i]/tot)}
  return o;
}
function calc(){
  const b={};M().forEach(m=>b[m.id]=0);
  let pend=0,mine=0;
  S.exps.forEach(e=>{
    if(e.status!='done'){pend++;return}
    const f=rate(e.cur);if(e.split.t=='personal'){if(e.payers[S.me])mine+=e.amount*f;return}
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v*f);
    Object.entries(owed(e)).forEach(([i,v])=>{b[i]=(b[i]||0)-v*f;if(i==S.me)mine+=v*f});
  });
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return {b,tr,pend,mine:r2(mine)};
}

function mkTr(b){
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return tr;
}
function calcOrig(){
  const g={};
  S.exps.forEach(e=>{
    if(e.status!='done'||e.split.t=='personal')return;
    const c=e.cur||S.trip.cur,b=g[c]||(g[c]={});
    M().forEach(m=>{if(b[m.id]===undefined)b[m.id]=0});
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v);
    Object.entries(owed(e)).forEach(([i,v])=>b[i]=(b[i]||0)-v);
  });
  return Object.entries(g).map(([c,b])=>({c,b,tr:mkTr(b)}));
}
const modeChips=()=>`<div class="chips"><button class="${S.sm=='twd'?'g':''}" data-a="sm" data-v="orig">原幣償還</button><button class="${S.sm=='twd'?'':'g'}" data-a="sm" data-v="twd">統一換算台幣</button></div>`;
const pk=(c,t)=>`${c}_${t[0]}_${t[1]}_${String(t[2]).replace('.','p')}`;
function origView(){
  const gs=calcOrig();
  if(!gs.length)return `<div class="card sub">還沒有可結算的帳目。</div>`;
  const pd=k=>S.trip.paid?.[k];
  return gs.map(({c,b,tr})=>{
    const rows=tr.map(t=>{const k=pk(c,t);return `<div class="row${pd(k)?' done':''}"><label class="chk"><input type="checkbox" data-a="paid" data-v="${k}" ${pd(k)?'checked':''}><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span></label><span class="amt">${money(t[2],c)}</span></div>`}).join('');
    const box=`<div class="card"><b>${sym(c)} ${c}</b>${M().map(m=>{const v=r2(b[m.id]||0);return `<div class="row"><span>${esc(m.name)}</span><span class="amt ${v>0?'pos':v<0?'neg':''}">${v>0?'應收 ':v<0?'應付 ':''}${money(Math.abs(v),c)}</span></div>`}).join('')}<div class="sub" style="margin-top:8px">怎麼轉帳（勾選代表已支付）</div>${tr.length?rows:`<div class="sub">不用轉帳。</div>`}</div>`;
    const twd=c!=BASE?`<div class="card"><b>折合新台幣</b> <small class="sub">匯率 ${c}：${rate(c).toFixed(4)}</small>${tr.length?tr.map(t=>`<div class="row${pd(pk(c,t))?' done':''}"><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span><span class="amt">${money(t[2]*rate(c),BASE)}</span></div>`).join(''):`<div class="sub">不用轉帳。</div>`}</div>`:'';
    return box+twd;
  }).join('');
}

/* ---------- views ---------- */
function loginBtn(){return S.user?`<button class="g" data-a="logout">登出</button>`:`<button class="g" data-a="login">Google 登入</button>`}
function home(){
  const ts=allTrips();
  return `<header><h1>${ICON}<span class="br">旅遊記帳</span></h1><button class="g" data-a="set">設定</button>${loginBtn()}</header><main>
  ${S.user?`<p class="sub">已登入：${esc(S.user.displayName||S.user.email)}，旅程會跟著帳號走</p>`:`<p class="sub">登入後換手機也找得回旅程。朋友用連結就能參與，不用登入。</p>`}
  ${ts.length?ts.map(t=>`<button class="card trip" data-a="open" data-v="${esc(t.id)}"><b>${esc(t.name)}</b></button>`).join(''):`<div class="card sub" style="text-align:center">${ICON}<br>還沒有旅程，建立第一趟吧。</div>`}
  <button class="fab" data-a="newTrip">＋ 新增旅程</button></main>`;
}
function lab(e){
  if(e.status!='done')return `<span class="badge">待補充</span>`;
  const t=e.split.t;
  return t=='personal'?`<span class="badge p">個人</span>`:`<span class="sub">${t=='equal'?'平均':t=='share'?'份數':'指定金額'}</span>`;
}
function tripView(){
  const hd=(t)=>`<header><button class="g" data-a="home">←</button><h1><span class="br">${esc(t)}</span></h1><button class="g" data-a="set">設定</button><button class="g" data-a="share">分享</button></header>`;
  if(S.trip===null)return hd('載入中…')+`<main class="sub">載入中…</main>`;
  if(S.trip===false)return hd('找不到旅程')+`<main><div class="card">這個連結找不到旅程，請確認連結是否完整，或網路是否正常。</div></main>`;
  const base=BASE;
  let body='';
  if(S.tab=='plan')body=planView();
  else if(S.tab=='map')body=mapView();
  else if(S.tab=='exp'){
    const f=S.flt;
    const list=S.exps.filter(e=>f=='all'||(f=='group'&&e.status=='done'&&e.split.t!='personal')||(f=='per'&&e.split?.t=='personal')||(f=='pend'&&e.status!='done'));
    const chip=(k,t)=>`<button class="${f==k?'':'g'}" data-a="flt" data-v="${k}">${t}</button>`;
    body=`<div class="chips">${chip('all','全部')}${chip('group','團體分帳')}${chip('per','個人')}${chip('pend','待補充')}</div>
    ${list.length?list.map(e=>{
      const d=e.ts?.toDate?.();
      return `<button class="card trip" data-a="edit" data-v="${e.id}"><div class="row"><b>${esc(e.note||'未命名')}</b><span class="amt">${money(e.amount,e.cur||S.trip.cur)}${(e.cur||S.trip.cur)!=base?`<small class="sub"> ≈${money(e.amount*rate(e.cur),base)}</small>`:''}</span></div>
      <div class="row sub"><span>${esc(Object.keys(e.payers).map(nm).join('、'))} 付${d?' · '+d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}):''}</span>${lab(e)}</div></button>`}).join(''):`<div class="card sub">沒有符合的帳目。按右下角「＋」快速記一筆。</div>`}
    <button class="fab" data-a="add">${f=='per'?'＋ 記個人花費':'＋ 快速記帳'}</button>`;
  }else{
    const c=calc();
    body=`${c.pend?`<div class="card" style="background:var(--warnb);color:var(--warn)">還有 ${c.pend} 筆待補充，沒有算進結算，結果可能不準。</div>`:''}
    ${origView()}
    ${S.me?`<div class="card"><div class="row"><span>我的總花費（分擔＋個人）</span><span class="amt">${money(c.mine,base)}</span></div></div>`:''}`;
  }
  return hd(S.trip.name)+`<main>
  <div class="row sub"><span>我是：${S.me?esc(nm(S.me)):'未選擇'}</span><span>${S.me?`<button class="g" data-a="rename">改名</button> `:''}<button class="g" data-a="who">更換</button></span></div>
  <div class="tabs">${[['plan','行程'],['map','地圖'],['exp','記帳'],['set','結算']].map(([k,n])=>`<button class="${S.tab==k?'':'g'}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</div>
  ${body}</main>`;
}
function render(){
  $('#app').innerHTML=S.tid?tripView():home();
  if(S.tid&&S.trip&&S.tab=='map')setTimeout(initMap,0);
  if(S.tid&&S.trip&&!S.me&&!$('#sheet').classList.contains('on'))openWho();
}

/* ---------- itinerary & map ---------- */
const dayLabel=d=>new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'});
const sortedStops=()=>[...S.stops].sort((a,b)=>((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99')));
function planView(){
  const list=sortedStops(),fab=`<button class="fab" data-a="addStop">＋ 新增景點</button>`;
  if(!list.length)return `<div class="card sub">還沒有行程。按右下角「＋」新增景點，搜尋地點就能放到地圖上。</div>`+fab;
  let cur=null,h='';
  list.forEach(p=>{
    const d=p.date||'';
    if(d!==cur){cur=d;h+=`<div class="sub" style="margin:12px 4px 6px"><b>${d?esc(dayLabel(d)):'未排日期'}</b></div>`}
    const vs=Object.values(p.visited||{}).filter(Boolean).length,mine=!!p.visited?.[S.me];
    h+=`<div class="card" style="padding:10px 12px"><div class="row" style="margin:0"><label class="chk"><input type="checkbox" data-a="visit" data-v="${p.id}" ${mine?'checked':''} aria-label="我去過了"></label><button class="stp" data-a="editStop" data-v="${p.id}"><b>${esc(p.name)}</b><div class="sub">${p.lat!=null?'<span class="badge p">地圖</span> ':''}${p.time?esc(p.time)+' · ':''}${esc(p.note||'')}</div></button><span class="sub">${vs?'去過 '+vs+'/'+M().length:''}</span></div></div>`;
  });
  return h+`<div class="sub" style="margin:4px 6px 0">勾選代表「我去過了」，每個人各自勾自己的。</div>`+fab;
}
function mapView(){
  const n=S.stops.filter(p=>p.lat!=null).length;
  return `<div class="card" style="padding:8px"><div id="map"></div></div><div class="sub" style="margin:0 6px">${n?'圓點數字是景點順序，綠色代表你去過了，虛線連起同一天的路線。':'新增景點時搜尋地點，就會顯示在地圖上。'}</div>`;
}
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  return new Promise((res,rej)=>{
    const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.append(c);
    const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=res;j.onerror=rej;document.head.append(j);
  });
}
async function initMap(){
  const el=$('#map');if(!el)return;
  try{await loadLeaflet()}catch(e){el.innerHTML='<div class="sub" style="padding:24px">地圖載入失敗，請確認網路連線。</div>';return}
  const box=$('#map');if(!box||S.tab!='map')return;
  let mv=null;
  if(S.map){try{mv={c:S.map.getCenter(),z:S.map.getZoom()};S.map.remove()}catch(e){}S.map=null}
  const pts=sortedStops().filter(p=>p.lat!=null);
  const map=L.map(box);S.map=map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const days={};
  pts.forEach((p,i)=>{
    const mine=!!p.visited?.[S.me];
    L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pin${mine?' v':''}">${i+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map)
      .bindPopup(`<b>${esc(p.name)}</b><br>${esc((p.date?dayLabel(p.date):'')+' '+(p.time||''))}`);
    (days[p.date||'']=days[p.date||'']||[]).push([p.lat,p.lng]);
  });
  Object.values(days).forEach(a=>{if(a.length>1)L.polyline(a,{color:'#6a8fa0',weight:3,opacity:.7,dashArray:'6 8'}).addTo(map)});
  if(mv)map.setView(mv.c,mv.z);
  else if(pts.length)map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36],maxZoom:15});
  else map.setView([30,125],3);
}
function openStop(id){
  const p=S.stops.find(x=>x.id==id)||{};
  S.sf={id:p.id||null,lat:p.lat??null,lng:p.lng??null};S.sr=[];
  sheet(`<h3>${p.id?'編輯景點':'新增景點'}</h3>
  <label>景點名稱</label><div class="row" style="gap:6px"><input id="sn" value="${esc(p.name||'')}" placeholder="例如：首里城"><button data-a="srch" style="flex:none;padding:10px 16px">搜尋</button></div>
  <div id="sres"></div>
  <div id="spos" class="sub">${p.lat!=null?'已設定地圖位置':'還沒有地圖位置（可以略過）'}</div>
  <label>日期</label><input id="sd" type="date" value="${esc(p.date||ls('tl_date_'+S.tid)||'')}">
  <label>時間</label><input id="stm" type="time" value="${esc(p.time||'')}">
  <label>備註</label><input id="sm" value="${esc(p.note||'')}" placeholder="例如：門票 400 元">
  <div class="btns">${p.id?`<button class="d" data-a="delStop">刪除</button>`:`<button class="g" data-a="close">取消</button>`}<button data-a="saveStop">儲存</button></div>`);
}

/* ---------- sheets ---------- */
function openWho(){
  sheet(`<h3>你是哪一位？</h3><p class="sub">選到對應的名字後，可以按「改名」換成你想用的名字。這支手機會記住你的選擇。</p>
  ${M().map(m=>`<button class="card trip" data-a="setMe" data-v="${m.id}">${esc(m.name)}</button>`).join('')}
  <label>名單裡沒有我</label><input id="nn" placeholder="輸入你的名字"><div class="btns"><button data-a="addMe">加入並選擇</button></div>`);
}
function newTripSheet(){
  sheet(`<h3>新增旅程</h3>
  <label>旅程名稱</label><input id="tn" placeholder="例如：2027 東京">
  <label>預設記帳幣別（結算一律換算成新台幣）</label><select id="tc">${curOpts("JPY")}</select>
  <label>成員（用頓號、逗號或換行分開，第一個填你自己）</label><textarea id="tm" rows="3" placeholder="小明、小華、阿美"></textarea>
  <div class="btns"><button class="g" data-a="close">取消</button><button data-a="createTrip">建立</button></div>`);
}
function openForm(id){
  const e=S.exps.find(x=>x.id==id)||{};S.ef=e;
  const ms=M(),multi=e.payers&&Object.keys(e.payers).length>1,pid=(e.payers&&Object.keys(e.payers)[0])||S.me,t=e.split?.t||(!e.id&&S.flt=='per'?'personal':'');
  const op=(v,n)=>`<option value="${v}" ${t==v?'selected':''}>${n}</option>`;
  sheet(`<h3>${e.id?'編輯帳目':'快速記帳'}</h3>
  <div class="row" style="gap:6px"><select id="fc" style="width:44%">${curOpts(e.cur||ls('tl_cur_'+S.tid)||S.trip.cur)}</select><input id="fa" type="number" inputmode="decimal" placeholder="金額" value="${e.amount||''}"></div>
  <input id="fn" placeholder="備註（選填）" value="${esc(e.note||'')}">
  <label>誰付的</label><select id="fp">${ms.map(m=>`<option value="${m.id}" ${m.id==pid?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
  <label style="display:flex;align-items:center"><input type="checkbox" id="fm" ${multi?'checked':''}>多人付款</label>
  <div id="pm" ${multi?'':'hidden'}>${ms.map(m=>`<div class="row"><span>${esc(m.name)}</span><input type="number" inputmode="decimal" id="p_${m.id}" value="${e.payers?.[m.id]||''}"></div>`).join('')}</div>
  <label>怎麼分</label><select id="fs">${op('','先不決定（待補充）')}${op('equal','平均')}${op('amount','指定金額')}${op('share','按份數')}${op('personal','個人花費（不分帳）')}</select>
  <div id="sp"></div>
  <div class="btns">${e.id?`<button class="d" data-a="del">刪除</button>`:`<button class="g" data-a="close">取消</button>`}<button data-a="save">儲存</button></div>`);
  spRows();
  if(!e.id)setTimeout(()=>$('#fa').focus(),50);
}
function spRows(){
  const e=S.ef,t=$('#fs').value,same=e.split&&e.split.t==t,w=same?e.split.w:{};
  $('#sp').innerHTML=(t==''||t=='personal')?'':M().map(m=>{
    const on=same?w[m.id]!==undefined:true;
    return `<div class="row"><label style="display:flex;align-items:center;margin:0;color:var(--tx);font-size:16px"><input type="checkbox" class="sc" value="${m.id}" ${on?'checked':''}>${esc(m.name)}</label>${t=='equal'?'':`<input type="number" inputmode="decimal" class="sv" data-m="${m.id}" value="${w[m.id]??(t=='share'?1:'')}" placeholder="${t=='share'?'份數':'金額'}">`}</div>`}).join('');
}
document.addEventListener('change',ev=>{
  if(ev.target.id=='fs')spRows();
  if(ev.target.id=='fm')$('#pm').hidden=!ev.target.checked;
});

async function saveExp(){
  const amt=+$('#fa').value;if(!(amt>0))return toast('請輸入金額');
  let payers;
  if($('#fm').checked){
    payers={};let s=0;
    M().forEach(m=>{const v=+$('#p_'+m.id).value;if(v>0){payers[m.id]=v;s+=v}});
    if(!s)payers={[$('#fp').value]:amt};
    else if(Math.abs(s-amt)>0.01)return toast((s>amt?'付款總額超過 ':'付款總額還差 ')+num(Math.abs(amt-s)));
  }else payers={[$('#fp').value]:amt};
  const t=$('#fs').value;let split=null;
  if(t=='personal'){
    if(Object.keys(payers).length>1)return toast('個人花費只能一個人付');
    split={t,w:{}};
  }else if(t){
    const w={};
    document.querySelectorAll('.sc:checked').forEach(c=>{
      const i=c.value;
      w[i]=t=='equal'?1:(+document.querySelector(`.sv[data-m="${i}"]`).value||0);
    });
    const ks=Object.keys(w);
    if(!ks.length)return toast('請勾選有分擔的人');
    if(t=='share')ks.forEach(k=>{if(!(w[k]>0))w[k]=1});
    if(t=='amount'){
      const s=ks.reduce((a,k)=>a+w[k],0);
      if(Math.abs(s-amt)>0.01)return toast((s>amt?'分擔超過 ':'分擔還差 ')+num(Math.abs(amt-s)));
    }
    split={t,w};
  }
  const cur=$('#fc').value;ls('tl_cur_'+S.tid,cur);const data={cur,amount:amt,note:$('#fn').value.trim(),payers,split,status:split?'done':'pending'};
  try{
    if(S.ef.id)await updateDoc(doc(db,'trips',S.tid,'expenses',S.ef.id),data);
    else await addDoc(collection(db,'trips',S.tid,'expenses'),{...data,by:S.me||null,ts:serverTimestamp()});
    closeSheet();
  }catch(err){toast('儲存失敗：'+(err.code||err.message))}
}

/* ---------- settings ---------- */
const setKid=()=>{};
const ICON='<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="20" height="14" rx="6"/><path d="M10 9V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M9 14v5M19 14v5"/></svg>';
const curOpts=sel=>[...new Set([S.trip?.cur,...CURS].filter(Boolean))].map(c=>`<option value="${c}" ${c==sel?'selected':''}>${sym(c)} ${c}</option>`).join('');
function openSettings(){
  const th=document.documentElement.dataset.t||'light';
  const T={light:['淺色','#f5efe5','#4a3b2d'],dark:['深色','#85745f','#fbf5ea']};
  let h=`<h3>設定</h3><label>主題顏色</label><div class="sw">${Object.entries(T).map(([k,v])=>`<button class="swb" data-a="theme" data-v="${k}" style="--c:${v[1]};color:${v[2]}">${k==th?'✓ ':''}${v[0]}</button>`).join('')}</div><label>底圖</label><div class="sw">${[['scene','地球'],['boy','男孩'],['girl','女孩'],['none','無']].map(([k,n])=>`<button class="swb" data-a="art" data-v="${k}" style="--c:var(--sec)">${(ls('tl_art')||'scene')==k?'✓ ':''}${n}</button>`).join('')}</div>`;
  if(S.tid&&S.trip){
    h+=`<label>匯率（換算成新台幣，預設只是大約值，請自行確認）</label>`+CURS.filter(c=>c!=BASE).map(c=>`<div class="row"><span><b>${c}</b> <small class="sub">${CN[c]||''}</small></span><input type="number" inputmode="decimal" step="any" class="rt" data-c="${c}" value="${rate(c).toFixed(4)}"></div>`).join('')+`<div class="btns"><button data-a="saveRates">儲存匯率</button></div>`;
  }
  sheet(h);
}

/* ---------- actions ---------- */
const act={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('登入失敗：'+e.code)),
  logout:()=>signOut(auth),
  open:id=>openTrip(id),
  home:()=>goHome(),
  newTrip:newTripSheet,
  close:closeSheet,
  set:openSettings,
  addStop:()=>S.me?openStop():openWho(),
  editStop:id=>openStop(id),
  visit:async(id,el)=>{
    if(!S.me){el.checked=false;return openWho()}
    try{await updateDoc(doc(db,'trips',S.tid,'stops',id),{['visited.'+S.me]:el.checked})}
    catch(e){toast('更新失敗：'+(e.code||e.message));render()}
  },
  srch:async()=>{
    const q=$('#sn').value.trim();if(!q)return toast('先輸入景點名稱');
    const box=$('#sres');box.innerHTML='<div class="sub">搜尋中…</div>';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=zh-TW&q='+encodeURIComponent(q));
      S.sr=await r.json();
      box.innerHTML=S.sr.length?S.sr.map((x,i)=>`<button class="card trip" style="padding:10px 14px;font-size:14px" data-a="pick" data-v="${i}">${esc(x.display_name)}</button>`).join(''):'<div class="sub">找不到，換個關鍵字試試，或不設定位置直接儲存。</div>';
    }catch(e){box.innerHTML='<div class="sub">搜尋失敗，請稍後再試。</div>'}
  },
  pick:i=>{
    const x=S.sr[+i];if(!x)return;
    S.sf.lat=+x.lat;S.sf.lng=+x.lon;
    $('#spos').textContent='已選位置：'+x.display_name.split(',').slice(0,3).join(',');
    $('#sres').innerHTML='';
  },
  saveStop:async()=>{
    const name=$('#sn').value.trim();if(!name)return toast('請輸入景點名稱');
    const date=$('#sd').value,data={name,date,time:$('#stm').value,note:$('#sm').value.trim(),lat:S.sf.lat,lng:S.sf.lng};
    try{
      if(S.sf.id)await updateDoc(doc(db,'trips',S.tid,'stops',S.sf.id),data);
      else await addDoc(collection(db,'trips',S.tid,'stops'),{...data,visited:{},ts:serverTimestamp()});
      if(date)ls('tl_date_'+S.tid,date);
      closeSheet();
    }catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  delStop:async()=>{
    if(!confirm('確定刪除這個景點？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'stops',S.sf.id));closeSheet()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  art:v=>{ls('tl_art',v);document.documentElement.dataset.art=v;openSettings()},
  paid:async(k,el)=>{
    try{await updateDoc(doc(db,'trips',S.tid),{['paid.'+k]:el.checked})}
    catch(e){toast('更新失敗：'+(e.code||e.message));render()}
  },
  rename:()=>sheet(`<h3>修改我的名字</h3><input id="rn" maxlength="20" value="${esc(nm(S.me))}"><div class="btns"><button class="g" data-a="close">取消</button><button data-a="saveName">儲存</button></div>`),
  saveName:async()=>{
    const n=$('#rn').value.trim();if(!n)return toast('名字不能是空的');
    try{await updateDoc(doc(db,'trips',S.tid),{members:M().map(m=>m.id==S.me?{...m,name:n}:m)});closeSheet();toast('已改名')}
    catch(e){toast('改名失敗：'+(e.code||e.message))}
  },
  theme:v=>{ls('tl_theme',v);document.documentElement.dataset.t=v;openSettings()},
  saveRates:async()=>{
    const rates={};
    document.querySelectorAll('.rt').forEach(i=>{const v=+i.value;if(v>0)rates[i.dataset.c]=v});
    try{await updateDoc(doc(db,'trips',S.tid),{rates});toast('已儲存匯率');closeSheet()}
    catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  tab:v=>{S.tab=v;S.map=null;render()},
  flt:v=>{S.flt=v;render()},
  add:()=>S.me?openForm():openWho(),
  edit:id=>openForm(id),
  save:saveExp,
  who:openWho,
  setMe:id=>{S.me=id;ls('tl_me_'+S.tid,id);closeSheet();render()},
  addMe:async()=>{
    const n=$('#nn').value.trim();if(!n)return toast('請輸入名字');
    const id='m'+Date.now().toString(36);
    try{await updateDoc(doc(db,'trips',S.tid),{members:arrayUnion({id,name:n})});act.setMe(id)}
    catch(e){toast('加入失敗：'+(e.code||e.message))}
  },
  del:async()=>{
    if(!confirm('確定刪除這筆帳目？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'expenses',S.ef.id));closeSheet()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  share:async()=>{
    const url=location.origin+location.pathname+'?t='+S.tid;
    try{
      if(navigator.share)await navigator.share({title:S.trip.name,url});
      else{await navigator.clipboard.writeText(url);toast('連結已複製')}
    }catch(e){prompt('複製這個連結傳給朋友：',url)}
  },
  createTrip:async()=>{
    const name=$('#tn').value.trim(),cur=$('#tc').value.trim()||'TWD';
    const names=$('#tm').value.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);
    if(!name)return toast('請輸入旅程名稱');
    if(!names.length)return toast('請至少輸入一位成員');
    const members=names.map((n,i)=>({id:'m'+(i+1),name:n}));
    try{
      const r=await addDoc(collection(db,'trips'),{name,cur,members,created:serverTimestamp()});
      ls('tl_me_'+r.id,'m1');addTrip(r.id,name);closeSheet();openTrip(r.id);
    }catch(e){toast('建立失敗：'+(e.code||e.message))}
  }
};
document.addEventListener('click',ev=>{
  if(ev.target.id=='sheet'){closeSheet();return}
  const t=ev.target.closest('[data-a]');
  if(t)act[t.dataset.a]?.(t.dataset.v,t);
});

document.documentElement.dataset.t=ls('tl_theme')=='dark'?'dark':'light';
document.documentElement.dataset.art=ls('tl_art')||'scene';
const first=new URLSearchParams(location.search).get('t');
first?openTrip(first,false):render();
</script>
</body>
