<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅遊記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root,[data-t=sea]{--bg:#F2F8FB;--pri:#8EC5DA;--sec:#CFE6F0;--tx:#3E5560;--land:#F6E7B8}
[data-t=sakura]{--bg:#FFF6F6;--pri:#F2A7B8;--sec:#FAD4C0;--tx:#5B4A4F;--land:#FBE3D3}
[data-t=matcha]{--bg:#F5F8EE;--pri:#9CC5A1;--sec:#DDE8B5;--tx:#44514A;--land:#F1F2C8}
[data-t=peach]{--bg:#FFF7F0;--pri:#F4B183;--sec:#F9D9A6;--tx:#594A3E;--land:#FFF1CF}
[data-t=lav]{--bg:#F7F4FB;--pri:#B7A6DB;--sec:#DCD2F0;--tx:#4E4660;--land:#F4ECFB}
:root{--card:#ffffffe8;--sub:color-mix(in srgb,var(--tx) 62%,#fff);--bd:color-mix(in srgb,var(--pri) 50%,#fff);--sh:0 8px 20px color-mix(in srgb,var(--pri) 38%,transparent);--warn:#b4570c;--warnb:#fdeedd;--perb:#e4eefb;--per:#2f5fae}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.6 "Huninn","Iansui","Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 100px;min-height:100vh;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
header h1{font-size:21px;margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.br{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--pri) 62%,transparent) 58% 92%,transparent 92%);padding:0 8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px;max-width:560px;margin:0 auto}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--pri);color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
button.g{background:var(--card);border:2px solid var(--bd);box-shadow:none;padding:8px 14px}
button.d{background:var(--card);color:#b8392b;border:2px solid var(--bd);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 70%,#000);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.trip{display:block;width:100%;text-align:left;color:var(--tx);font-weight:400}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0}
.row input[type=number]{width:120px}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:18px;background:#fff;color:var(--tx);margin:4px 0}
input[type=checkbox]{width:auto;margin:0 6px 0 0;accent-color:var(--pri)}
label{display:block;font-size:14px;color:var(--sub);margin-top:10px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:4px 2px 10px}
.chips button{white-space:nowrap;padding:6px 14px}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--warnb);color:var(--warn)}
.badge.p{background:var(--perb);color:var(--per)}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));padding:14px 22px;font-size:17px;box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 60%,transparent)}
#sheet{position:fixed;inset:0;background:rgba(40,60,70,.38);display:none;align-items:flex-end;z-index:20}
#sheet.on{display:flex}
#sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
#sheet h3{margin:0 0 6px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;z-index:30;display:none;max-width:90%}
.pos{color:#2f8f6b}.neg{color:#c0392b}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swb{background:var(--c);padding:8px 14px}
#kid{position:fixed;left:50%;top:50%;width:min(80vw,380px);aspect-ratio:240/300;transform:translate(-50%,-50%);opacity:.8;pointer-events:none;z-index:0}
#kid svg{width:100%;height:100%}
header,main{position:relative;z-index:1}
.kh{fill:color-mix(in srgb,var(--tx) 50%,#fff)}.ka{fill:var(--pri)}.ks{fill:var(--sec)}.kk{fill:#ffe9dc}.kc{fill:#F2A7B8}.ke{fill:var(--tx)}
.kq{fill:color-mix(in srgb,var(--pri) 45%,#fff)}.kl{stroke:#ffe3d3}.kt{stroke:color-mix(in srgb,var(--tx) 50%,#fff)}.kw{fill:#fff}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 70%,#fff),var(--bg) 62%,color-mix(in srgb,var(--sec) 45%,#fff))}

.kb{fill:color-mix(in srgb,#f3d58d 65%,var(--sec))}.kg{fill:#4a3b36;stroke:#f1c15a;stroke-width:2}
label.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:16px}
.chk input{width:22px;height:22px;margin:0}
.row.done{opacity:.55}.row.done .amt,.row.done .chk span{text-decoration:line-through}

function addTrip(id,name){
  if(!S.local.find(t=>t.id==id)){S.local.push({id,name});ls('tl_trips',JSON.stringify(S.local))}
  if(S.user&&!S.cloud.find(t=>t.id==id))setDoc(doc(db,'users',S.user.uid),{trips:arrayUnion({id,name})},{merge:true}).catch(()=>{});
}
const allTrips=()=>{const m=new Map();[...S.local,...S.cloud].forEach(t=>m.set(t.id,t));return [...m.values()].reverse()};

function openTrip(id,push=true){
  S.u2&&S.u2();S.u3&&S.u3();

/* ---------- calculations ---------- */
const M=()=>S.trip.members;
const nm=id=>M().find(m=>m.id==id)?.name||'?';
const BASE='TWD';
const rate=c=>{c=c||S.trip.cur;if(c==BASE)return 1;const r=S.trip.rates?.[c];return r>0?r:(DEF[c]||1)};
function owed(e){
  const s=e.split;if(!s||s.t=='personal')return {};
  const ids=Object.keys(s.w),o={};
  if(s.t=='amount')ids.forEach(i=>o[i]=s.w[i]);
  else{const tot=ids.reduce((a,i)=>a+s.w[i],0);ids.forEach(i=>o[i]=e.amount*s.w[i]/tot)}
  return o;
}
function calc(){
  const b={};M().forEach(m=>b[m.id]=0);
  let pend=0,mine=0;
  S.exps.forEach(e=>{
    if(e.status!='done'){pend++;return}
    const f=rate(e.cur);if(e.split.t=='personal'){if(e.payers[S.me])mine+=e.amount*f;return}
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v*f);
    Object.entries(owed(e)).forEach(([i,v])=>{b[i]=(b[i]||0)-v*f;if(i==S.me)mine+=v*f});
  });
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return {b,tr,pend,mine:r2(mine)};
}

function mkTr(b){
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return tr;
}
function calcOrig(){
  const g={};
  S.exps.forEach(e=>{
    if(e.status!='done'||e.split.t=='personal')return;
    const c=e.cur||S.trip.cur,b=g[c]||(g[c]={});
    M().forEach(m=>{if(b[m.id]===undefined)b[m.id]=0});
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v);
    Object.entries(owed(e)).forEach(([i,v])=>b[i]=(b[i]||0)-v);
  });
  return Object.entries(g).map(([c,b])=>({c,b,tr:mkTr(b)}));
}
const modeChips=()=>`<div class="chips"><button class="${S.sm=='twd'?'g':''}" data-a="sm" data-v="orig">原幣償還</button><button class="${S.sm=='twd'?'':'g'}" data-a="sm" data-v="twd">統一換算台幣</button></div>`;
const pk=(c,t)=>`${c}_${t[0]}_${t[1]}_${String(t[2]).replace('.','p')}`;
function origView(){
  const gs=calcOrig();
  if(!gs.length)return `<div class="card sub">還沒有可結算的帳目。</div>`;
  const pd=k=>S.trip.paid?.[k];
  return gs.map(({c,b,tr})=>{
    const rows=tr.map(t=>{const k=pk(c,t);return `<div class="row${pd(k)?' done':''}"><label class="chk"><input type="checkbox" data-a="paid" data-v="${k}" ${pd(k)?'checked':''}><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span></label><span class="amt">${money(t[2],c)}</span></div>`}).join('');
    const box=`<div class="card"><b>${sym(c)} ${c}</b>${M().map(m=>{const v=r2(b[m.id]||0);return `<div class="row"><span>${esc(m.name)}</span><span class="amt ${v>0?'pos':v<0?'neg':''}">${v>0?'應收 ':v<0?'應付 ':''}${money(Math.abs(v),c)}</span></div>`}).join('')}<div class="sub" style="margin-top:8px">怎麼轉帳（勾選代表已支付）</div>${tr.length?rows:`<div class="sub">不用轉帳。</div>`}</div>`;
    const twd=c!=BASE?`<div class="card"><b>折合新台幣</b> <small class="sub">匯率 ${c}：${rate(c).toFixed(4)}</small>${tr.length?tr.map(t=>`<div class="row${pd(pk(c,t))?' done':''}"><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span><span class="amt">${money(t[2]*rate(c),BASE)}</span></div>`).join(''):`<div class="sub">不用轉帳。</div>`}</div>`:'';
    return box+twd;
  }).join('');
}

}
function tripView(){
  const hd=(t)=>`<header><button class="g" data-a="home">←</button><h1><span class="br">${esc(t)}</span></h1><button class="g" data-a="set">設定</button><button class="g" data-a="share">分享</button></header>`;
  if(S.trip===null)return hd('載入中…')+`<main class="sub">載入中…</main>`;
  if(S.trip===false)return hd('找不到旅程')+`<main><div class="card">這個連結找不到旅程，請確認連結是否完整，或網路是否正常。</div></main>`;
  const base=BASE;
  let body='';

    const f=S.flt;
    const list=S.exps.filter(e=>f=='all'||(f=='group'&&e.status=='done'&&e.split.t!='personal')||(f=='per'&&e.split?.t=='personal')||(f=='pend'&&e.status!='done'));
    const chip=(k,t)=>`<button class="${f==k?'':'g'}" data-a="flt" data-v="${k}">${t}</button>`;
    body=`<div class="chips">${chip('all','全部')}${chip('group','團體分帳')}${chip('per','個人')}${chip('pend','待補充')}</div>
    ${list.length?list.map(e=>{
      const d=e.ts?.toDate?.();
      return `<button class="card trip" data-a="edit" data-v="${e.id}"><div class="row"><b>${esc(e.note||'未命名')}</b><span class="amt">${money(e.amount,e.cur||S.trip.cur)}${(e.cur||S.trip.cur)!=base?`<small class="sub"> ≈${money(e.amount*rate(e.cur),base)}</small>`:''}</span></div>
      <div class="row sub"><span>${esc(Object.keys(e.payers).map(nm).join('、'))} 付${d?' · '+d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}):''}</span>${lab(e)}</div></button>`}).join(''):`<div class="card sub">沒有符合的帳目。按右下角「＋」快速記一筆。</div>`}
    <button class="fab" data-a="add">${f=='per'?'＋ 記個人花費':'＋ 快速記帳'}</button>`;
  }else{
    const c=calc();
    body=`${c.pend?`<div class="card" style="background:var(--warnb);color:var(--warn)">還有 ${c.pend} 筆待補充，沒有算進結算，結果可能不準。</div>`:''}
    ${origView()}
    ${S.me?`<div class="card"><div class="row"><span>我的總花費（分擔＋個人）</span><span class="amt">${money(c.mine,base)}</span></div></div>`:''}`;
  }
  return hd(S.trip.name)+`<main>
  <div class="row sub"><span>我是：${S.me?esc(nm(S.me)):'未選擇'}</span><span>${S.me?`<button class="g" data-a="rename">改名</button> `:''}<button class="g" data-a="who">更換</button></span></div>
  <div class="tabs"><button class="${S.tab=='exp'?'':'g'}" data-a="tab" data-v="exp">記帳</button><button class="${S.tab=='set'?'':'g'}" data-a="tab" data-v="set">結算</button></div>
  ${body}</main>`;
}

  if(ev.target.id=='fs')spRows();
  if(ev.target.id=='fm')$('#pm').hidden=!ev.target.checked;
});

async function saveExp(){
  const amt=+$('#fa').value;if(!(amt>0))return toast('請輸入金額');
  let payers;
  if($('#fm').checked){
    payers={};let s=0;
    M().forEach(m=>{const v=+$('#p_'+m.id).value;if(v>0){payers[m.id]=v;s+=v}});
    if(!s)payers={[$('#fp').value]:amt};
    else if(Math.abs(s-amt)>0.01)return toast((s>amt?'付款總額超過 ':'付款總額還差 ')+num(Math.abs(amt-s)));
  }else payers={[$('#fp').value]:amt};
  const t=$('#fs').value;let split=null;
  if(t=='personal'){
    if(Object.keys(payers).length>1)return toast('個人花費只能一個人付');
    split={t,w:{}};
  }else if(t){
    const w={};
    document.querySelectorAll('.sc:checked').forEach(c=>{
      const i=c.value;
      w[i]=t=='equal'?1:(+document.querySelector(`.sv[data-m="${i}"]`).value||0);
    });
    const ks=Object.keys(w);
    if(!ks.length)return toast('請勾選有分擔的人');
    if(t=='share')ks.forEach(k=>{if(!(w[k]>0))w[k]=1});
    if(t=='amount'){
      const s=ks.reduce((a,k)=>a+w[k],0);
      if(Math.abs(s-amt)>0.01)return toast((s>amt?'分擔超過 ':'分擔還差 ')+num(Math.abs(amt-s)));
    }
    split={t,w};
  }
  const cur=$('#fc').value;ls('tl_cur_'+S.tid,cur);const data={cur,amount:amt,note:$('#fn').value.trim(),payers,split,status:split?'done':'pending'};
  try{
    if(S.ef.id)await updateDoc(doc(db,'trips',S.tid,'expenses',S.ef.id),data);
    else await addDoc(collection(db,'trips',S.tid,'expenses'),{...data,by:S.me||null,ts:serverTimestamp()});
    closeSheet();
  }catch(err){toast('儲存失敗：'+(err.code||err.message))}
}

  tab:v=>{S.tab=v;render()},
  flt:v=>{S.flt=v;render()},
  add:()=>S.me?openForm():openWho(),
  edit:id=>openForm(id),
  save:saveExp,
  who:openWho,
  setMe:id=>{S.me=id;ls('tl_me_'+S.tid,id);closeSheet();render()},
  addMe:async()=>{
    const n=$('#nn').value.trim();if(!n)return toast('請輸入名字');
    const id='m'+Date.now().toString(36);
    try{await updateDoc(doc(db,'trips',S.tid),{members:arrayUnion({id,name:n})});act.setMe(id)}
    catch(e){toast('加入失敗：'+(e.code||e.message))}
  },
  del:async()=>{
    if(!confirm('確定刪除這筆帳目？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'expenses',S.ef.id));closeSheet()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  share:async()=>{
    const url=location.origin+location.pathname+'?t='+S.tid;
    try{
      if(navigator.share)await navigator.share({title:S.trip.name,url});
      else{await navigator.clipboard.writeText(url);toast('連結已複製')}
    }catch(e){prompt('複製這個連結傳給朋友：',url)}
  },
  createTrip:async()=>{
    const name=$('#tn').value.trim(),cur=$('#tc').value.trim()||'TWD';
    const names=$('#tm').value.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);
    if(!name)return toast('請輸入旅程名稱');
    if(!names.length)return toast('請至少輸入一位成員');
    const members=names.map((n,i)=>({id:'m'+(i+1),name:n}));
    try{
      const r=await addDoc(collection(db,'trips'),{name,cur,members,created:serverTimestamp()});
      ls('tl_me_'+r.id,'m1');addTrip(r.id,name);closeSheet();openTrip(r.id);
    }catch(e){toast('建立失敗：'+(e.code||e.message))}
  }
};
document.addEventListener('click',ev=>{
  if(ev.target.id=='sheet'){closeSheet();return}
  const t=ev.target.closest('[data-a]');
  if(t)act[t.dataset.a]?.(t.dataset.v,t);
});

document.documentElement.dataset.t=ls('tl_theme')||'sea';
document.documentElement.dataset.art=ls('tl_art')||'scene';
const first=new URLSearchParams(location.search).get('t');
first?openTrip(first,false):render();
</script>
</body>
</html>
