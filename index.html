<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅遊記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:18px/1.6 "Huninn","Iansui","Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 100px;min-height:100vh;min-height:100dvh;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
header h1{font-size:23px;margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.br{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--pri) 62%,transparent) 58% 92%,transparent 92%);padding:0 8px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px;max-width:560px;margin:0 auto}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--pri);color:var(--on);cursor:pointer;box-shadow:var(--sh)}
button.g{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:none;padding:8px 14px}
button.d{background:var(--card);color:var(--neg);border:2px solid var(--bd);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 70%,#000);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.trip{display:block;width:100%;text-align:left;color:var(--tx);font-weight:400}
.sub{color:var(--sub);font-size:15.5px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0}
.row input[type=number]{width:120px}
input,select,textarea{font:inherit;width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:18px;background:var(--inp);color:var(--tx);margin:4px 0}
input[type=checkbox]{width:auto;margin:0 6px 0 0;accent-color:var(--pri)}
label{display:block;font-size:15.5px;color:var(--sub);margin-top:10px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:4px 2px 10px}
.chips button{white-space:nowrap;padding:6px 14px}
.badge{font-size:13.5px;padding:2px 10px;border-radius:99px;background:var(--warnb);color:var(--warn)}
.badge.p{background:var(--perb);color:var(--per)}
.amt{font-weight:700;font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));padding:14px 22px;font-size:18.5px;box-shadow:0 8px 22px color-mix(in srgb,var(--pri) 60%,transparent)}
#sheet,#sheet2{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-end;z-index:20}
#sheet.on,#sheet2.on{display:flex}
#sheet2{z-index:25}
#sheet>div,#sheet2>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
#sheet h3,#sheet2 h3{margin:0 0 6px}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tbg);color:var(--tfg);padding:10px 18px;border-radius:99px;z-index:30;display:none;max-width:90%}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swb{background:var(--c);color:var(--on);padding:8px 14px}
#kid{position:fixed;left:50%;top:50%;width:min(80vw,380px);aspect-ratio:240/300;transform:translate(-50%,-50%);opacity:.8;pointer-events:none;z-index:0}
#kid svg{width:100%;height:100%}
header,main{position:relative;z-index:1}
.kh{fill:color-mix(in srgb,var(--tx) 50%,#fff)}.ka{fill:var(--pri)}.ks{fill:var(--sec)}.kk{fill:#ffe9dc}.kc{fill:#F2A7B8}.ke{fill:var(--tx)}
.kq{fill:color-mix(in srgb,var(--pri) 45%,#fff)}.kl{stroke:#ffe3d3}.kt{stroke:color-mix(in srgb,var(--tx) 50%,#fff)}.kw{fill:#fff}

.kb{fill:color-mix(in srgb,#f3d58d 65%,var(--sec))}.kg{fill:#4a3b36;stroke:#f1c15a;stroke-width:2}
label.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:17.5px}
.chk input{width:22px;height:22px;margin:0}
.row.done{opacity:.55}.row.done .amt,.row.done .chk span{text-decoration:line-through}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,query,orderBy,serverTimestamp,arrayUnion} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDuy_r37AhVRdNtbwjtIIROgaukOgpW5-Y",
  authDomain:"travelledger-8ecf8.firebaseapp.com",
  projectId:"travelledger-8ecf8",
  storageBucket:"travelledger-8ecf8.firebasestorage.app",
  messagingSenderId:"365200427932",
  appId:"1:365200427932:web:74d5e8bf6e2fb122da1659"
});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round(x*100)/100;
const r4=x=>Math.round(x*10000)/10000;
const CURS=['TWD','JPY','USD','KRW','EUR','HKD','THB','SGD','CNY','GBP'];
const CN={JPY:'日幣',USD:'美元',KRW:'韓元',EUR:'歐元',HKD:'港幣',THB:'泰銖',SGD:'新加坡幣',CNY:'人民幣',GBP:'英鎊'};
const SYM={TWD:'NT$',JPY:'¥',USD:'US$',KRW:'₩',EUR:'€',HKD:'HK$',THB:'฿',SGD:'S$',CNY:'CN¥',GBP:'£'};
const DEF={TWD:1,JPY:0.21,USD:31,KRW:0.023,EUR:35,HKD:4,THB:0.9,SGD:24,CNY:4.3,GBP:41};
const sym=c=>SYM[c]||(c?c+' ':'');
const num=x=>r2(x).toLocaleString('zh-TW',{maximumFractionDigits:2});
const money=(x,c)=>sym(c||'TWD')+num(x);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

let S={bk:[],info:{},plists:null,slists:[],mapOpen:true,user:null,local:JSON.parse(ls('tl_trips')||'[]'),cloud:[],tid:null,trip:null,exps:[],tab:'exp',flt:'all',me:null,ef:{},u1:null,u2:null,u3:null};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function sheet(h){$('#sbody').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function sheet2(h){$('#sbody2').innerHTML=h;$('#sheet2').classList.add('on')}
function closeSheet2(){$('#sheet2').classList.remove('on')}

/* ---------- trips list ---------- */
function addTrip(id,name){
  if(!S.local.find(t=>t.id==id)){S.local.push({id,name});ls('tl_trips',JSON.stringify(S.local))}
  if(S.user&&!S.cloud.find(t=>t.id==id))setDoc(doc(db,'users',S.user.uid),{trips:arrayUnion({id,name})},{merge:true}).catch(()=>{});
}
const allTrips=()=>{const m=new Map();[...S.local,...S.cloud].forEach(t=>m.set(t.id,t));return [...m.values()].reverse()};

onAuthStateChanged(auth,u=>{
  S.user=u;if(S.u1){S.u1();S.u1=null}
  subPriv();
  if(u){
    S.u1=onSnapshot(doc(db,'users',u.uid),d=>{S.cloud=d.data()?.trips||[];render()});
    if(S.local.length)setDoc(doc(db,'users',u.uid),{trips:arrayUnion(...S.local)},{merge:true}).catch(()=>{});
  }else S.cloud=[];
  render();

/* ---------- calculations ---------- */
const M=()=>S.trip.members;
const nm=id=>M().find(m=>m.id==id)?.name||'?';
const BASE='TWD';
const rate=c=>{c=c||S.trip.cur;if(c==BASE)return 1;const r=S.trip.rates?.[c];return r>0?r:(DEF[c]||1)};
function owed(e){
  const s=e.split;if(!s||s.t=='personal')return {};
  const ids=Object.keys(s.w),o={};
  if(s.t=='amount')ids.forEach(i=>o[i]=s.w[i]);
  else{const tot=ids.reduce((a,i)=>a+s.w[i],0);ids.forEach(i=>o[i]=e.amount*s.w[i]/tot)}
  return o;
}
function calc(){
  const b={};M().forEach(m=>b[m.id]=0);
  let pend=0,mine=0;
  S.exps.forEach(e=>{
    if(e.status!='done'){pend++;return}
    const f=rate(e.cur);if(e.split.t=='personal'){if(e.payers[S.me])mine+=e.amount*f;return}
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v*f);
    Object.entries(owed(e)).forEach(([i,v])=>{b[i]=(b[i]||0)-v*f;if(i==S.me)mine+=v*f});
  });
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return {b,tr,pend,mine:r2(mine)};
}

function mkTr(b){
  const cr=[],de=[];
  Object.entries(b).forEach(([i,v])=>{v=r2(v);if(v>0.005)cr.push([i,v]);else if(v<-0.005)de.push([i,-v])});
  cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
  const tr=[];let x=0,y=0;
  while(x<cr.length&&y<de.length){
    const m=Math.min(cr[x][1],de[y][1]);
    tr.push([de[y][0],cr[x][0],r2(m)]);
    cr[x][1]=r2(cr[x][1]-m);de[y][1]=r2(de[y][1]-m);
    if(cr[x][1]<0.005)x++;if(de[y][1]<0.005)y++;
  }
  return tr;
}
function calcOrig(){
  const g={};
  S.exps.forEach(e=>{
    if(e.status!='done'||e.split.t=='personal')return;
    const c=e.cur||S.trip.cur,b=g[c]||(g[c]={});
    M().forEach(m=>{if(b[m.id]===undefined)b[m.id]=0});
    Object.entries(e.payers).forEach(([i,v])=>b[i]=(b[i]||0)+v);
    Object.entries(owed(e)).forEach(([i,v])=>b[i]=(b[i]||0)-v);
  });
  return Object.entries(g).map(([c,b])=>({c,b,tr:mkTr(b)}));
}
const modeChips=()=>`<div class="chips"><button class="${S.sm=='twd'?'g':''}" data-a="sm" data-v="orig">原幣償還</button><button class="${S.sm=='twd'?'':'g'}" data-a="sm" data-v="twd">統一換算台幣</button></div>`;
const pk=(c,t)=>`${c}_${t[0]}_${t[1]}_${String(t[2]).replace('.','p')}`;
function origView(){
  const gs=calcOrig();
  if(!gs.length)return `<div class="card sub">還沒有可結算的帳目。</div>`;
  const pd=k=>S.trip.paid?.[k];
  return gs.map(({c,b,tr})=>{
    const rows=tr.map(t=>{const k=pk(c,t);return `<div class="row${pd(k)?' done':''}"><label class="chk"><input type="checkbox" data-a="paid" data-v="${k}" ${pd(k)?'checked':''}><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span></label><span class="amt">${money(t[2],c)}</span></div>`}).join('');
    const box=`<div class="card"><b>${sym(c)} ${c}</b>${M().map(m=>{const v=r2(b[m.id]||0);return `<div class="row"><span>${esc(m.name)}</span><span class="amt ${v>0?'pos':v<0?'neg':''}">${v>0?'應收 ':v<0?'應付 ':''}${money(Math.abs(v),c)}</span></div>`}).join('')}<div class="sub" style="margin-top:8px">怎麼轉帳（勾選代表已支付）</div>${tr.length?rows:`<div class="sub">不用轉帳。</div>`}</div>`;
    const twd=c!=BASE?`<div class="card"><b>折合新台幣</b> <small class="sub">匯率 ${c}：${rate(c).toFixed(4)}</small>${tr.length?tr.map(t=>`<div class="row${pd(pk(c,t))?' done':''}"><span>${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span><span class="amt">${money(t[2]*rate(c),BASE)}</span></div>`).join(''):`<div class="sub">不用轉帳。</div>`}</div>`:'';
    return box+twd;
  }).join('');
}

function tripStatus(i){
  if(!i||!i.start)return null;
  const today=ymd(new Date()),a=i.start,b=i.end&&i.end>=a?i.end:a;
  const diff=(x,y)=>Math.round((new Date(y+'T00:00:00')-new Date(x+'T00:00:00'))/864e5);
  if(today<a)return {g:1,t:'還有 '+diff(today,a)+' 天出發',c:'up'};
  if(today<=b)return {g:0,t:'旅行中 第 '+(diff(a,today)+1)+' 天',c:'on'};

}

  }).join(''):`<div class="card sub">這天還沒有行程，按右下角「＋」新增。</div>`;
  return chips+head+filt+mini+body+`<div class="sub" style="margin:4px 6px 0">勾選代表「我去過了」，只會顯示你自己的勾選。</div>`+fab;
}
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  return new Promise((res,rej)=>{
    const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.append(c);
    const j=document.createElement('script');j.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';j.onload=res;j.onerror=rej;document.head.append(j);
  });
}
async function drawMap(box,sel){
  if(!box)return null;
  try{await loadLeaflet()}catch(e){box.innerHTML='<div class="sub" style="padding:24px">地圖載入失敗，請確認網路連線。</div>';return null}
  if(!box.isConnected||sel==='none')return null;
  const days=tripDays(),pts=[],hp={},ap={},line={};
  days.forEach((d,di)=>{
    if(sel!='all'&&d!=sel)return;
    const col=PAL[di%PAL.length],seq=[],aps=airportsOn(d);
    aps.filter(x=>x.k=='arr').forEach(x=>{ap[x.id]=x;seq.push([x.lat,x.lng])});
    const h0=hotelPrev(d);if(h0&&h0.lat!=null){hp[h0.id]=h0;seq.push([h0.lat,h0.lng])}
    sortedStops().filter(p=>p.date==d).forEach((p,i)=>{if(p.lat!=null){pts.push({p,n:i+1,col});seq.push([p.lat,p.lng])}});
    const h1=hotelOn(d);if(h1&&h1.lat!=null){hp[h1.id]=h1;seq.push([h1.lat,h1.lng])}
    aps.filter(x=>x.k=='dep').forEach(x=>{ap[x.id]=x;seq.push([x.lat,x.lng])});
    if(seq.length>1)line[d]={col,a:seq};
  });
  const map=L.map(box);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  pts.forEach(({p,n,col})=>{
    const mine=!!p.visited?.[S.me];
    L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pin${mine?' v':''}" style="background:${col};color:#fff">${n}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc((p.date?dayLabel(p.date):'')+' '+(p.time||''))}`);
  });
  const mk=(o,tag,bg,pop)=>L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${bg};color:#fff;font-size:13px">${tag}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup(pop);
  Object.values(hp).forEach(h=>mk(h,'宿','#8a6a45',`<b>${esc(h.name)}</b><br>入住 ${esc(md(h.d1))}　退房 ${esc(md(h.d2))}`));
  Object.values(ap).forEach(x=>mk(x,'機','#5b8fb0',`<b>${esc(x.name)}</b><br>${x.k=='arr'?'抵達':'出發'} ${esc(x.t||'')} ${esc(x.no||'')}`));
  Object.values(line).forEach(o=>L.polyline(o.a,{color:o.col,weight:3,opacity:.75,dashArray:'6 8'}).addTo(map));
  const all=[...pts.map(x=>[x.p.lat,x.p.lng]),...Object.values(hp).map(h=>[h.lat,h.lng]),...Object.values(ap).map(x=>[x.lat,x.lng])];
  if(all.length)map.fitBounds(all,{padding:[30,30],maxZoom:15});else map.setView([30,125],3);
  return map;
}

function parseCoords(t){
  t=(t||'').trim();let m;
  if(m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))return [+m[1],+m[2]];
  if(m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))return [+m[1],+m[2]];
  if(m=t.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i))return [+m[1],+m[2]];
  if(m=t.match(/^(-?\d{1,3}\.\d+)[\s,，]+(-?\d{1,3}\.\d+)$/))return [+m[1],+m[2]];
  return null;
}

function parseLinks(t){
  return (t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/https?:\/\/\S+/);if(!m)return null;
    let title=l.replace(m[0],'').trim();

  }).filter(Boolean);
}

function locate(q){

/* stats */
function pie(items){
  const tot=items.reduce((a,b)=>a+b.v,0);
  if(!tot)return '<div class="sub" style="padding:8px 2px">還沒有資料</div>';
  let a0=-Math.PI/2;const R=70,C=80,P=a=>[C+R*Math.cos(a),C+R*Math.sin(a)];
  const paths=items.map((it,i)=>{
    const a1=a0+it.v/tot*2*Math.PI,[x0,y0]=P(a0),[x1,y1]=P(a1-1e-4);
    const d=items.length==1?`M${C-R} ${C}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0Z`:`M${C} ${C}L${x0} ${y0}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}Z`;
    a0=a1;return `<path d="${d}" fill="${PIE[i%PIE.length]}" stroke="var(--card)" stroke-width="2"/>`;
  }).join('');
  const legend=items.map((it,i)=>`<div class="row" style="margin:3px 0"><span><i class="dot" style="background:${PIE[i%PIE.length]}"></i>${esc(it.n)}</span><span class="amt">${money(it.v,BASE)} <small class="sub">${Math.round(it.v/tot*100)}%</small></span></div>`).join('');
  return `<svg viewBox="0 0 160 160" style="width:min(60vw,220px);display:block;margin:6px auto 10px" aria-hidden="true">${paths}</svg>${legend}<div class="row" style="margin-top:6px"><b>合計</b><b class="amt">${money(tot,BASE)}</b></div>`;
}
const statName=(k,by)=>{

  return k=='none'?'未分類':catName(k);
};
function statsView(){

function openSettings(){
  const th=document.documentElement.dataset.t||'light';
  const T={light:['淺色','#f5efe5','#4a3b2d'],dark:['深色','#85745f','#fbf5ea']};
  let h=`<h3>設定</h3><label>主題顏色</label><div class="sw">${Object.entries(T).map(([k,v])=>`<button class="swb" data-a="theme" data-v="${k}" style="--c:${v[1]};color:${v[2]}">${k==th?'✓ ':''}${v[0]}</button>`).join('')}</div><label>底圖</label><div class="sw">${[['scene','地球'],['boy','男孩'],['girl','女孩'],['none','無']].map(([k,n])=>`<button class="swb" data-a="art" data-v="${k}" style="--c:var(--sec)">${(ls('tl_art')||'scene')==k?'✓ ':''}${n}</button>`).join('')}</div>`;
  if(S.tid&&S.trip){
    h+=`<label>旅程資料</label><input id="tn2" value="${esc(S.trip.name)}" placeholder="旅程名稱"><input id="td2" value="${esc(S.trip.desc||'')}" placeholder="描述（選填）"><div class="row" style="gap:6px"><input id="ds" type="date" value="${esc(S.trip.start||'')}"><input id="de" type="date" value="${esc(S.trip.end||'')}"></div><label>預設記帳幣別</label><select id="tc2">${curOpts(S.trip.cur)}</select><div class="btns"><button data-a="saveTrip">儲存旅程資料</button><button class="g" data-a="cats">管理分類</button></div>`;
    h+=`<label>匯率（換算成新台幣，預設只是大約值，請自行確認）</label>`+CURS.filter(c=>c!=BASE).map(c=>`<div class="row"><span><b>${c}</b> <small class="sub">${CN[c]||''}</small></span><input type="number" inputmode="decimal" step="any" class="rt" data-c="${c}" value="${rate(c).toFixed(4)}"></div>`).join('')+`<div class="btns"><button data-a="saveRates">儲存匯率</button></div>`;
    h+=`<button class="d" data-a="delTrip" style="width:100%;margin-top:18px">刪除這趟旅程</button>`;
  }
  sheet(h);
}

/* ---------- actions ---------- */
const act={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('登入失敗：'+e.code)),
  logout:()=>signOut(auth),
  open:id=>openTrip(id),
  home:()=>goHome(),
  newTrip:newTripSheet,
  close:closeSheet,
  set:openSettings,
  mems:id=>{
    const i=S.info[id],mem=i&&i!=='l'?(i.members||[]):[];
    sheet(`<h3>旅伴（${mem.length} 人）</h3><div>${mem.map(m=>`<span class="nm">${esc(m.name)}</span>`).join('')}</div><div class="btns"><button class="g" data-a="close">關閉</button></div>`);
  },
  newBk:()=>sheet(`<h3>新增</h3><div class="btns"><button data-a="newFlight">機票</button><button data-a="newHotel">飯店</button></div><div class="btns"><button class="g" data-a="close">取消</button></div>`),
  newFlight:()=>openFlight(),
  newHotel:()=>openHotel(),
  editBk:id=>{const b=S.bk.find(x=>x.id==id);if(!b)return;b.type=='hotel'?openHotel(id):openFlight(id)},
  bmap:id=>{const b=S.bk.find(x=>x.id==id);if(b)window.open(b.gurl||('https://www.google.com/maps/search/?api=1&query='+stopQ(b)),'_blank','noopener')},
  saveFlight:()=>{
    const d1=$('#fd1').value;if(!d1)return toast('請填出發日期，才能排進行程');
    const d2=$('#fd2').value||d1;
    if(d2<d1)return toast('抵達日期不能早於出發日期');
    const w=[...S.bw];if(!w.length)return toast('至少選一位搭乘旅伴');
    saveBk({type:'flight',dir:$('#fdir').value,no:$('#fno').value.trim(),from:$('#ffr').value.trim(),to:$('#fto').value.trim(),fLat:S.fl.from.lat,fLng:S.fl.from.lng,fG:S.fl.from.gurl||null,tLat:S.fl.to.lat,tLng:S.fl.to.lng,tG:S.fl.to.gurl||null,who:w.length==M().length?null:w,d1,t1:$('#ft1').value,d2,t2:$('#ft2').value,pnr:$('#fpn').value.trim(),note:$('#fnt').value.trim(),links:parseLinks($('#fln').value)});
  },
  saveHotel:()=>{
    const name=$('#sn').value.trim();if(!name)return toast('請輸入飯店名稱');
    const d1=$('#hd1').value,d2=$('#hd2').value;
    if(!d1||!d2)return toast('請填入住和退房日期');
    if(d2<=d1)return toast('退房日期要晚於入住日期');
    const links=parseLinks($('#hln').value);let {lat,lng}=S.sf;
    if(lat==null)for(const l of links){const c=parseCoords(l.u);if(c){lat=c[0];lng=c[1];break}}
    const w=[...S.bw];if(!w.length)return toast('至少選一位入住旅伴');
    saveBk({type:'hotel',who:w.length==M().length?null:w,name,addr:$('#sa').value.trim(),lat,lng,gurl:S.sf.gurl||null,d1,t1:$('#ht1').value,d2,t2:$('#ht2').value,pnr:$('#hpn').value.trim(),note:$('#hnt').value.trim(),links});
  },
  delBk:async()=>{
    if(!confirm('確定刪除這筆？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'bookings',S.bi));closeSheet()}catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  addStop:()=>S.me?openStop():openWho(),
  editStop:id=>openStop(id),
  infoStop:id=>openInfo(id),
  day:v=>{S.day=v;S.map=null;render()},
  visit:async(id,el)=>{
    if(!S.me){el.checked=false;return openWho()}
    try{await updateDoc(doc(db,'trips',S.tid,'stops',id),{['visited.'+S.me]:el.checked})}
    catch(e){toast('更新失敗：'+(e.code||e.message));render()}
  },
  gmap:id=>{const p=S.stops.find(x=>x.id==id);if(p)window.open(p.gurl||('https://www.google.com/maps/search/?api=1&query='+stopQ(p)),'_blank','noopener')},
  route:id=>{
    const p=S.stops.find(x=>x.id==id);if(!p)return;
    const day=sortedStops().filter(q=>q.date==p.date),i=day.findIndex(q=>q.id==id),pr=(p.date&&i>0)?day[i-1]:null;
    if(!pr)return toast('這是當天第一站，沒有上一站可以規劃路線');
    window.open('https://www.google.com/maps/dir/?api=1&origin='+stopQ(pr)+'&destination='+stopQ(p)+'&travelmode='+(TMODE[p.mode]||'transit'),'_blank','noopener');
  },
  mapfull:openMapFull,
  maptog:()=>{S.mapOpen=(S.mapOpen===false);render()},
  mf:async v=>{S.mf=v;$('#mfc').innerHTML=mfChips();try{S.map2&&S.map2.remove()}catch(e){}S.map2=await drawMap($('#map2'),S.mf)},
  srch:()=>{S.apt=null;const q=$('#sn').value.trim();if(!q)return toast('先輸入名稱');runSearch(q)},
  geo:()=>{
    S.apt=null;
    const q=$('#sa').value.trim(),url=(q.match(/https?:\/\/\S+/)||[])[0],rest=url?q.replace(url,'').trim():q;
    if(url&&rest&&$('#sn')&&!$('#sn').value.trim())$('#sn').value=rest.split('\n')[0].slice(0,40);
    locate(q);
  },
  apg:v=>{S.apt=v;locate(($(v=='from'?'#ffr':'#fto').value||'').trim())},
  pick:i=>{const x=S.sr[+i];if(!x)return;applyLoc({lat:+x.lat,lng:+x.lon},'已選位置：'+x.display_name.split(',').slice(0,3).join(','))},
  bwho:v=>{S.bw.has(v)?S.bw.delete(v):S.bw.add(v);$('#bwho').innerHTML=whoChips()},
  allf:(v,el)=>{S.allF=el.checked;S.map=null;render()},
  saveStop:async()=>{
    const name=$('#sn').value.trim();if(!name)return toast('請輸入景點名稱');
    const date=$('#sd').value,links=parseLinks($('#sl').value);
    let {lat,lng}=S.sf;
    if(lat==null)for(const l of links){const c=parseCoords(l.u);if(c){lat=c[0];lng=c[1];break}}
    const data={name,date,time:$('#stm').value,note:$('#sm').value.trim(),addr:$('#sa').value.trim(),lat,lng,gurl:S.sf.gurl||null,mode:$('#smd').value,mins:+$('#smn').value||null,tnote:$('#stn').value.trim(),links};
    try{
      if(S.sf.id)await updateDoc(doc(db,'trips',S.tid,'stops',S.sf.id),data);
      else await addDoc(collection(db,'trips',S.tid,'stops'),{...data,visited:{},ts:serverTimestamp()});
      if(date){ls('tl_date_'+S.tid,date);S.day=date}
      closeSheet();
    }catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  delStop:async()=>{
    if(!confirm('確定刪除這個景點？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'stops',S.sf.id));closeSheet()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  saveTrip:async()=>{
    const name=$('#tn2').value.trim(),a=$('#ds').value||null,b=$('#de').value||null;
    if(!name)return toast('旅程名稱不能是空的');
    if(a&&b&&b<a)return toast('回程日期不能早於去程');
    try{
      await updateDoc(doc(db,'trips',S.tid),{name,desc:$('#td2').value.trim(),start:a,end:b,cur:$('#tc2').value});
      const e=S.local.find(t=>t.id==S.tid);if(e){e.name=name;ls('tl_trips',JSON.stringify(S.local))}
      toast('已儲存');closeSheet();
    }catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  delTrip:async()=>{
    if(!confirm('確定刪除「'+S.trip.name+'」？\n旅程會從所有人的首頁消失，資料先保留在雲端，之後還能復原。'))return;
    try{await updateDoc(doc(db,'trips',S.tid),{deleted:true});closeSheet();goHome()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  restoreTrip:async()=>{try{await updateDoc(doc(db,'trips',S.tid),{deleted:false});toast('已復原')}catch(e){toast('復原失敗：'+(e.code||e.message))}},
  cats:openCats,
  close2:closeSheet2,
  cadd:()=>{catSync();const n=$('#cnew').value.trim();if(!n)return toast('請輸入分類名稱');S.ct.push({id:'c'+Date.now().toString(36),name:n,subs:[]});$('#ctl').innerHTML=catRows();$('#cnew').value=''},
  cdel:i=>{catSync();S.ct.splice(+i,1);$('#ctl').innerHTML=catRows()},
  csadd:i=>{
    catSync();const el=document.querySelector(`#sheet2 .cs[data-c="${i}"]`),n=(el&&el.value||'').trim();
    if(!n)return toast('請輸入小分類名稱');
    const c=S.ct[+i];c.subs=c.subs||[];c.subs.push({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:n});$('#ctl').innerHTML=catRows();
  },
  csdel:v=>{catSync();const [i,k]=v.split('|');S.ct[+i].subs.splice(+k,1);$('#ctl').innerHTML=catRows()},
  csave:async()=>{
    catSync();const list=S.ct.filter(c=>c.name).map(c=>({...c,subs:(c.subs||[]).filter(u=>u.name)}));
    if(!list.length)return toast('至少要留一個分類');
    try{
      await updateDoc(doc(db,'trips',S.tid),{cats:list});S.trip.cats=list;
      if(S.fcat&&!list.some(c=>c.id==cid(S.fcat)))S.fcat=null;
      if(S.fsub&&!subName(S.fcat,S.fsub))S.fsub=null;
      if($('#fcat')){$('#fcat').innerHTML=catChips();$('#fsub').innerHTML=subChips()}
      toast('已儲存分類');closeSheet2();
    }catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  pcat:v=>{S.fcat=cid(S.fcat)==v?null:v;S.fsub=null;$('#fcat').innerHTML=catChips();$('#fsub').innerHTML=subChips()},
  psub:v=>{S.fsub=S.fsub==v?null:v;$('#fsub').innerHTML=subChips()},
  stsc:v=>{S.stSc=v;render()},
  stby:v=>{S.stBy=v;render()},
  lnew:async sc=>{
    const n=(prompt('清單名稱')||'').trim();if(!n)return;
    const id='l'+Date.now().toString(36);
    if(sc=='p')return savePriv([...privLists(),{id,name:n,items:[]}]);
    try{
      if(!S.slists.length&&!ls('tl_nodef_'+S.tid))await setDoc(doc(db,'trips',S.tid,'lists','buy'),{name:'購買清單',items:[],ts:serverTimestamp()});
      await setDoc(doc(db,'trips',S.tid,'lists',id),{name:n,items:[],ts:serverTimestamp()})}catch(e){toast('新增失敗：'+(e.code||e.message))}
  },
  lren:v=>{const [sc,lid]=v.split('|');const l=(sc=='p'?privLists():sharedLists()).find(x=>x.id==lid);if(!l)return;const n=(prompt('清單名稱',l.name)||'').trim();if(n)mutList(sc,lid,x=>{x.name=n})},
  ldel:async v=>{
    const [sc,lid]=v.split('|');if(!confirm('確定刪除這份清單？'))return;
    if(sc=='p')return savePriv(privLists().filter(x=>x.id!=lid));
    if(S.slists.length<=1)ls('tl_nodef_'+S.tid,'1');
    if(!S.slists.some(x=>x.id==lid))return render();
    try{await deleteDoc(doc(db,'trips',S.tid,'lists',lid))}catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  ltog:(v,el)=>{const [sc,lid,iid]=v.split('|');mutList(sc,lid,l=>{const it=l.items.find(x=>x.id==iid);if(it){it.d=el.checked;it.by=el.checked?(S.me||null):null}})},
  litem:v=>{const [sc,lid,iid]=v.split('|');openItem(sc,lid,iid)},
  lsave:()=>{
    const t=$('#lt').value.trim();if(!t)return toast('請輸入項目');
    const {sc,lid,iid}=S.li,n=$('#lnn').value.trim();
    mutList(sc,lid,l=>{if(iid){const it=l.items.find(x=>x.id==iid);if(it){it.t=t;it.n=n}}else l.items.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,n,d:false,by:null})});
    closeSheet();
  },
  lrm:()=>{const {sc,lid,iid}=S.li;mutList(sc,lid,l=>{l.items=l.items.filter(x=>x.id!=iid)});closeSheet()},
  art:v=>{ls('tl_art',v);document.documentElement.dataset.art=v;openSettings()},
  paid:async(k,el)=>{
    try{await updateDoc(doc(db,'trips',S.tid),{['paid.'+k]:el.checked})}
    catch(e){toast('更新失敗：'+(e.code||e.message));render()}
  },
  rename:()=>sheet(`<h3>修改我的名字</h3><input id="rn" maxlength="20" value="${esc(nm(S.me))}"><div class="btns"><button class="g" data-a="close">取消</button><button data-a="saveName">儲存</button></div>`),
  saveName:async()=>{
    const n=$('#rn').value.trim();if(!n)return toast('名字不能是空的');
    try{await updateDoc(doc(db,'trips',S.tid),{members:M().map(m=>m.id==S.me?{...m,name:n}:m)});closeSheet();toast('已改名')}
    catch(e){toast('改名失敗：'+(e.code||e.message))}
  },
  theme:v=>{ls('tl_theme',v);document.documentElement.dataset.t=v;openSettings()},
  saveRates:async()=>{
    const rates={};
    document.querySelectorAll('.rt').forEach(i=>{const v=+i.value;if(v>0)rates[i.dataset.c]=v});
    try{await updateDoc(doc(db,'trips',S.tid),{rates});toast('已儲存匯率');closeSheet()}
    catch(e){toast('儲存失敗：'+(e.code||e.message))}
  },
  tab:v=>{S.tab=v;S.map=null;render()},
  flt:v=>{S.flt=v;render()},
  add:()=>S.me?openForm():openWho(),
  edit:id=>openForm(id),
  save:saveExp,
  who:openWho,
  setMe:id=>{S.me=id;ls('tl_me_'+S.tid,id);closeSheet();render()},
  addMe:async()=>{
    const n=$('#nn').value.trim();if(!n)return toast('請輸入名字');
    const id='m'+Date.now().toString(36);
    try{await updateDoc(doc(db,'trips',S.tid),{members:arrayUnion({id,name:n})});act.setMe(id)}
    catch(e){toast('加入失敗：'+(e.code||e.message))}
  },
  del:async()=>{
    if(!confirm('確定刪除這筆帳目？'))return;
    try{await deleteDoc(doc(db,'trips',S.tid,'expenses',S.ef.id));closeSheet()}
    catch(e){toast('刪除失敗：'+(e.code||e.message))}
  },
  share:async()=>{
    const url=location.origin+location.pathname+'?t='+S.tid;
    try{
      if(navigator.share)await navigator.share({title:S.trip.name,url});
      else{await navigator.clipboard.writeText(url);toast('連結已複製')}
    }catch(e){prompt('複製這個連結傳給朋友：',url)}
  },
  createTrip:async()=>{
    const name=$('#tn').value.trim(),cur=$('#tc').value.trim()||'TWD';
    const names=$('#tm').value.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);
    if(!name)return toast('請輸入旅程名稱');
    if(!names.length)return toast('請至少輸入一位成員');
    const members=names.map((n,i)=>({id:'m'+(i+1),name:n}));
    try{
      const start=$('#t1').value||null,end=$('#t2').value||null;
      if(start&&end&&end<start)return toast('回程日期不能早於去程');
      const r=await addDoc(collection(db,'trips'),{name,cur,members,start,end,created:serverTimestamp()});
      ls('tl_me_'+r.id,'m1');addTrip(r.id,name);closeSheet();openTrip(r.id);
    }catch(e){toast('建立失敗：'+(e.code||e.message))}
  }
};
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if((ev.key=='Enter'||ev.key==' ')&&t.getAttribute&&t.getAttribute('role')=='button'){ev.preventDefault();t.click()}
});
document.addEventListener('click',ev=>{
  if(ev.target.id=='sheet'){closeSheet();return}
  if(ev.target.id=='sheet2'){closeSheet2();return}
  const t=ev.target.closest('[data-a]');
  if(t)act[t.dataset.a]?.(t.dataset.v,t);
});

document.documentElement.dataset.t=ls('tl_theme')=='dark'?'dark':'light';
document.documentElement.dataset.art=ls('tl_art')||'scene';
const first=new URLSearchParams(location.search).get('t');
first?openTrip(first,false):render();
</script>
</body>
</html>
